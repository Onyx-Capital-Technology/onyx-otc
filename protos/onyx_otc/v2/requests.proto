syntax = "proto3";

package onyx_otc.v2;
option csharp_namespace = "Onyx.Otc";

import "onyx_otc/v2/common.proto";
import "onyx_otc/v2/types.proto";
import "google/protobuf/timestamp.proto";


message NewOrderRequest {
  optional string client_order_id = 1;
  string account_id = 2;
  TradableSymbol symbol = 3;
  Decimal quantity = 11;
  Side side = 12;
  OrderType order_type = 14;
  Decimal price = 15;
  optional Exchange exchange = 16;
}

message CancelOrderRequest {
  string order_id = 1;
}

message TickersChannel {
  repeated string products = 1;
}

message ContractTickersChannel {
  repeated string contracts = 1;
}

message RfqChannel {
  TradableSymbol symbol = 1;
  Decimal size = 2;
  optional Exchange exchange = 3;
}

message OrderBookTopChannel {
  repeated string products = 1;
}

message ContractOrderBookTopChannel {
  repeated string contracts = 1;
}

message OrderBookChannel {
  TradableSymbol symbol = 1;
  optional Exchange exchange = 2;
}

// One dynamic-pricer cross-product subscription: the product-pair key plus the
// target unit the difference should be priced in (e.g. "05brg-brtsw" + "bbl").
// Optional cross-tenor strip start tenors (e.g. "u26"/"z26"); both empty ->
// matched same-tenor differences (default), both set -> stepped strip.
message DyTickerProduct {
  string key = 1;
  string unit = 2;
  string front_tenor = 3;
  string back_tenor = 4;
}

message DyTickerChannel {
  repeated DyTickerProduct products = 1;
}

message ManualRfqLeg {
  TradableSymbol symbol = 1;
  Side side = 2;
  Decimal lots = 3;
}

// Subscribing opens an RFQ. Closing the socket cancels the RFQs it opened.
message ManualRfqChannel {
  string product_symbol = 1;
  optional string account_id = 2;
  repeated ManualRfqLeg legs = 3;
}

message ManualRfqCancel {
  string rfq_id = 1;
}

// Subscribe to a channel of RFQs the user can quote.
message ManualRfqRequestsChannel {}

message ManualRfqReply {
  string rfq_id = 1;
  optional string account_id = 2;
  oneof reply {
    ManualRfqLegPrice price = 3;
    ManualRfqPass pass = 4;
  }
}

// Trades a firm quote as it stands: every leg at the quoted prices, or nothing
message AcceptManualRfqQuote {
  string quote_id = 1;
}

message ServerInfoChannel {}
message OrdersChannel {}

message Auth {
  string token = 2;
}

message NotificationsChannel {}

// Snapshot on subscribe, then a push on every new contract, retirement or delta change
message OptionContractsChannel {
  // Empty means every live option contract
  repeated string symbols = 1;
}

message Subscribe {
  oneof channel {
    ServerInfoChannel server_info = 1;
    OrdersChannel orders = 2;
    TickersChannel tickers = 3;
    RfqChannel rfq_channel = 4;
    OrderBookTopChannel order_book_top = 5;
    OrderBookChannel order_book = 6;
    DyTickerChannel dy_ticker = 7;
    NotificationsChannel notifications = 8;
    ContractTickersChannel contract_tickers = 9;
    ContractOrderBookTopChannel contract_order_book_top = 10;
    ManualRfqChannel manual_rfq = 11;
    ManualRfqRequestsChannel manual_rfq_requests = 12;
    OptionContractsChannel option_contracts = 13;
  }
}

message Unsubscribe {
  oneof channel {
    ServerInfoChannel server_info = 1;
    OrdersChannel orders = 2;
    TickersChannel tickers = 3;
    RfqChannel rfq_channel = 4;
    OrderBookTopChannel order_book_top = 5;
    OrderBookChannel order_book = 6;
    DyTickerChannel dy_ticker = 7;
    NotificationsChannel notifications = 8;
    ContractTickersChannel contract_tickers = 9;
    ContractOrderBookTopChannel contract_order_book_top = 10;
    ManualRfqCancel manual_rfq = 11;
    ManualRfqRequestsChannel manual_rfq_requests = 12;
    OptionContractsChannel option_contracts = 13;
  }
}

message OtcRequest {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  Method method = 3;
  oneof request {
    Auth auth = 10;
    Subscribe subscribe = 11;
    Unsubscribe unsubscribe = 12;
    NewOrderRequest order = 13;
    CancelOrderRequest cancel_order = 14;
    ManualRfqReply manual_rfq_reply = 15;
    AcceptManualRfqQuote accept_manual_rfq_quote = 16;
  }
}
